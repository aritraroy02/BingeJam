<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
  *{box-sizing:border-box}
</style></head><body>
<!-- BingeJam feature graphic, 1024×500. Rendered with Chrome headless (see SCREENSHOTS.md). -->
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1E6B"/>
      <stop offset="0.5" stop-color="#3D47C4"/>
      <stop offset="1" stop-color="#1FB6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#FF4D8D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DFC"/>
      <stop offset="0.55" stop-color="#4E8BFF"/>
      <stop offset="1" stop-color="#1FB6FF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- icon disc on the left -->
  <g transform="translate(150,250)">
    <circle r="132" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.40" stroke-width="2.5"/>
    <circle r="112" fill="url(#disc)"/>
    <!-- play triangle + sync arc glyph -->
    <path d="M -28 -46 L 52 0 L -28 46 Z" fill="#fff" fill-opacity="0.96"/>
    <path d="M 66 -70 A 92 92 0 1 1 -70 -66" fill="none" stroke="#fff" stroke-opacity="0.9"
          stroke-width="11" stroke-linecap="round" transform="scale(0.78)"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="330" y="212" font-size="86" font-weight="800" fill="#fff" letter-spacing="-1">BingeJam</text>
  <text x="333" y="272" font-size="31" font-weight="500" fill="#fff" fill-opacity="0.92">Watch and listen together, in sync.</text>

  <!-- feature chips -->
  <g font-size="22" font-weight="600" fill="#fff">
    <g transform="translate(333,320)">
      <rect width="196" height="52" rx="26" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.3"/>
      <text x="98" y="33" text-anchor="middle">Watch parties</text>
    </g>
    <g transform="translate(545,320)">
      <rect width="120" height="52" rx="26" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.3"/>
      <text x="60" y="33" text-anchor="middle">Jams</text>
    </g>
    <g transform="translate(681,320)">
      <rect width="196" height="52" rx="26" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.3"/>
      <text x="98" y="33" text-anchor="middle">Friends + chat</text>
    </g>
    <g transform="translate(333,386)">
      <rect width="170" height="52" rx="26" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.3"/>
      <text x="85" y="33" text-anchor="middle">Voice chat</text>
    </g>
  </g>
</svg>
</body></html>
