name = "vyro-push-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
FIREBASE_PROJECT_ID = "syncit-watchparty"
DATABASE_URL = "https://syncit-watchparty-default-rtdb.asia-southeast1.firebasedatabase.app"

# Profile pictures (free plan: 1 GB, 100k reads and 1k writes a day).
# New-release check (announceRelease in src/index.js). Free plan: up to 5 cron triggers.
[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "AVATARS"
id = "e2762004f519436e8bb63d669365b86e"

# Room voice chat (src/voice.js): one Durable Object per room. The free plan only has SQLite-backed ones.
[[durable_objects.bindings]]
name = "VOICE"
class_name = "VoiceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceRoom"]

# Secret, never in this file or the repo:
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT < path/to/service-account.json
#   wrangler secret put WATCHMODE_API_KEY      (Netflix title lookup, GET /netflix; free Watchmode key)
